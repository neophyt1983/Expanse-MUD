services:
  - type: web
    name: expanse-private
    runtime: python
    plan: 1c-2g
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python render_server.py
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: expanse-data
      mountPath: /var/data/expanse
      sizeGB: 1
    envVars:
      - key: EXPANSE_DATA_DIR
        value: /var/data/expanse
      - key: EXPANSE_OWNER_NAME
        sync: false
      - key: EXPANSE_OWNER_PASSWORD
        sync: false
