name: MMO authorization contract

on:
  pull_request:
    paths:
      - "server/mmo_access.py"
      - "server/mmo_roles.py"
      - "server/mmo_ownership.py"
      - "server/accounts.py"
      - "server/shared_authority.py"
      - "server/shared_staging.py"
      - "server/game_server.py"
      - "server/society_server.py"
      - "server/dm_console.py"
      - "engine/**"
      - "private_game.py"
      - "render_server.py"
      - "requirements.txt"
      - "web/session-menu.js"
      - "web/save-browser.js"
      - "web/dm-console.js"
      - "tests/test_shared*.py"
      - "tests/test_multi_player_isolation.py"
      - "tests/test_mmo_access.py"
      - "tests/test_mmo_modes_roles.py"
      - ".github/workflows/mmo-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the engine's pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Test engine, shared host, permissions and persistence
        run: |
          python -m unittest discover -s tests -v
          PYTHONPATH="$PWD" python tests/test_multi_player_isolation.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser changes and player-list regressions
        run: |
          node --check web/session-menu.js
          node --check web/save-browser.js
          node --check web/dm-console.js
          node --test tests/test_player_lists.cjs
