name: World simulation and interface regressions

on:
  pull_request:
    paths:
      - "engine/**"
      - "server/**"
      - "web/**"
      - "*.js"
      - "*.css"
      - "index.html"
      - "tests/**"
      - "tools/probe_*_layout.py"
      - "tools/stage_*_content.py"
      - "tools/stage_market_employment.py"
      - "tools/author_animal_profiles.py"
      - "tools/audit_world_map.py"
      - "tools/audit_supply_chains.py"
      - ".github/workflows/interior-room-visibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_*.cjs
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt WebEngine runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 libegl1 libgl1 libopengl0 libgbm1 libnss3 libxkbcommon0 libxkbfile1 libxcb-dri3-0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libglib2.0-0t64 libdbus-1-3 libfontconfig1
      - run: python -m pip install PySide6==6.12.0
      - name: Check the last Location & Inventory control in a real browser
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: python tools/probe_location_panel_layout.py
      - name: Check blocked-passage explanations in a real browser
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: python tools/probe_passage_layout.py
      - name: Check personal custody notices in a real browser
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: python tools/probe_custody_layout.py
      - name: Check conversation colors and emphasis in a real browser
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: python tools/probe_conversation_layout.py
      - name: Check guild, theft, skill and work controls in a real browser
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: python tools/probe_task_actions_layout.py
      - name: Check emotional expression and complete speech in a real browser
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: |
          python tools/probe_npc_expression_layout.py
          python tools/probe_speech_bubble_layout.py
